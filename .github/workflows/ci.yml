name: CI

# 共有部品のテスト。push と PR で実行する。
#   - test: worker/ の Node テスト（共有 JS）
#   - dotnet: src/ の C# 共通コードの xUnit テスト
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test (Worker の共有 JS)
        run: npm test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test (C# の共通コード)
        run: dotnet test tests/FaraSiteKit.Core.Tests --configuration Release
