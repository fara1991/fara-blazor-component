name: CI

# 共有部品のテスト。push と PR で実行する。ubuntu と windows の 2 つで並列に動かす（matrix）。
#   - test: worker/・build/・csp/・tools/ の Node テスト（共有 JS・静的ファイルの生成・CSP・レイアウト計測の判定）
#   - lint: ESLint（tools/lint/eslint.config.shared.mjs の共通設定。違反は止める）
#   - layout-check: レイアウト計測の統合テスト（ブラウザ・ubuntu のみ。正しい例は 0 件、崩した例は違反が出ることを確かめる）
#   - dotnet: src/ の C# 共通コードの xUnit テスト、Razor 部品の bUnit テスト、samples/MinimalSite のビルド（Directory.Build.props の静的解析も効く）
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test (Worker の共有 JS・build・csp・レイアウト計測の判定)
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (devDependencies。版は package-lock.json のとおり)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

  layout-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (devDependencies)
        run: npm ci

      - name: Install Chromium (playwright-core の依存込み)
        run: npx playwright-core install --with-deps chromium

      - name: Test (レイアウト計測の統合テスト)
        run: npm run test:layout-check

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test (C# の共通コード)
        run: dotnet test tests/FaraSiteKit.Core.Tests --configuration Release

      - name: Test (Razor 部品)
        run: dotnet test tests/FaraSiteKit.Razor.Tests --configuration Release

      - name: Build (Razor 部品を使う最小のサイト。公開はしない)
        run: dotnet build samples/MinimalSite --configuration Release
