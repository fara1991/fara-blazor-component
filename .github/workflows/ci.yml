name: CI

# 共有部品のテスト。push と PR で実行する。ubuntu と windows の 2 つで並列に動かす（matrix）。
#   - test: worker/ の Node テスト（共有 JS）
#   - dotnet: src/ の C# 共通コードの xUnit テスト
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test (Worker の共有 JS)
        run: npm test

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test (C# の共通コード)
        run: dotnet test tests/FaraSiteKit.Core.Tests --configuration Release

      - name: Test (Razor 部品)
        run: dotnet test tests/FaraSiteKit.Razor.Tests --configuration Release
