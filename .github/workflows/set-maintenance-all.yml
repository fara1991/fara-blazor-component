name: Set maintenance (all sites)

# 5 サイト(pokemon・avatar・bot・portfolio・album)のメンテナンス表示を、まとめて切り替える。
# 各サイトの deploy ワークフローを gh workflow run で起動し(tools/maintenance.mjs の set)、各サイトが wrangler deploy --var で反映する。
# 反映先は、対象ブランチのチェックボックスで選ぶ(複数可)。サイトは常に 5 つすべて。
#   develop = 各サイトの dev(確認用)、master = 各サイトの本番(そのブランチの最新のコードが公開される)
# dev(develop)を先に全部起動し、全部成功したら、本番(master)を 1 サイトずつ起動する。
#
# 安全のしくみ(docs/maintenance-cli.md の「kit の Actions から 5 サイトまとめて切り替える」):
#   - トリガは workflow_dispatch だけ(PR・issue・コメントでは動かない。fork の PR にシークレットは渡らない)。実行できるのは書き込み権限のある人だけ
#   - 実行元(Use workflow from)は master だけ。validate が ref を検査する。PAT(SITES_DISPATCH_TOKEN)は Environment のシークレットで、
#     dev の job は develop-maintenance、本番の job は production-maintenance(必須レビュワー)。どちらも Deployment branches は master のみにする
#     (repository secret にしないのは、workflow_dispatch が「実行時に選んだ ref」のワークフローを使うため。書き込み権限者が別ブランチで抜けられる)
#   - 入力は環境変数で受け、tools/maintenance-all.mjs が検査する(シェルには埋め込まない)
#   - SITES_DISPATCH_TOKEN(4 リポジトリに限定した fine-grained PAT)は、各 job の最後の step(gh を動かす step)にだけ渡す
#   - 事前確認(計画): 対象ブランチのワークフローが入力 maintenance_mode を受け取れる版かを見て、受け取れないサイトは警告つきで飛ばす。
#     dev job の計画で、本番を含む選んだ全対象の飛ばすサイトが、本番の承認画面より前にジョブサマリーに出る
on:
  workflow_dispatch:
    inputs:
      develop:
        description: "各サイトの dev(develop ブランチ)に反映する"
        type: boolean
        default: true
      master:
        description: "各サイトの本番(master ブランチ)に反映する。maintenance_mode が必須。承認が要る。master の最新のコードが公開される"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない（master を選ぶときは必須）"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # 入力の検査(シークレットは渡さない)。ここで通らなければ、後の job は動かない
  validate:
    runs-on: ubuntu-latest
    steps:
      # 実行元は master だけ(組み合わせの検査は、次の Validate inputs も行う)
      - name: Require master
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::このワークフローは master から実行してください(Use workflow from: master)"
          exit 1
      # actions/checkout・setup-node は GitHub 公式。このリポジトリでは他のワークフローでも同じ版を使っており、タグ指定のままにしている
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inputs
        run: node tools/maintenance-all.mjs --validate-only
        env:
          RUN_REF: ${{ github.ref }}
          TARGET_DEVELOP: ${{ inputs.develop }}
          TARGET_MASTER: ${{ inputs.master }}
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

  # 計画(選んだ全対象の事前確認)と、dev(develop)の実行。Environment develop-maintenance(Deployment branches = master)。
  # master だけを選んだときも、計画のためにこの job は動く(本番の承認の前に、飛ばすサイトを見せる)
  dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: develop-maintenance
    # 同時に動かすのは 1 つ(実行中のものは cancel しない)。待てるのは 1 件だけで、さらに追加すると古い待機は取り消される。dev と本番は別の枠
    concurrency:
      group: set-maintenance-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan and set maintenance (dev)
        run: node tools/maintenance-all.mjs --phase dev
        env:
          RUN_REF: ${{ github.ref }}
          TARGET_DEVELOP: ${{ inputs.develop }}
          TARGET_MASTER: ${{ inputs.master }}
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          GH_TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}

  # master(各サイトの本番)。dev 系が全部成功してから。Environment production-maintenance の承認(必須レビュワー)が済むまで動かない
  production:
    needs: dev
    if: ${{ inputs.master }}
    runs-on: ubuntu-latest
    environment: production-maintenance
    concurrency:
      group: set-maintenance-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set maintenance (production)
        run: node tools/maintenance-all.mjs --phase production
        env:
          RUN_REF: ${{ github.ref }}
          TARGET_DEVELOP: ${{ inputs.develop }}
          TARGET_MASTER: ${{ inputs.master }}
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          GH_TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
